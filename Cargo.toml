[workspace]
resolver = "2"

members = [
    "packages/php.rs/php-npai",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Nyar Team"]
license = "MPL-2.0"
repository = "https://github.com/nyar-vm/php"

[workspace.dependencies]
# The PHP language implementation lives in Boost `language.php` (parser in `data.text.php`).
# This repository owns only the Node-API export layer.
language-php = { git = "https://github.com/oovm/boost.rs", rev = "08b77a39e67b5a074a05f0a8ee5269670f336f4a" }
data-text-core = { git = "https://github.com/oovm/boost.rs", rev = "08b77a39e67b5a074a05f0a8ee5269670f336f4a" }
data-text-php = { git = "https://github.com/oovm/boost.rs", rev = "08b77a39e67b5a074a05f0a8ee5269670f336f4a" }

napi = { version = "3.16.2", default-features = true, features = ["napi4"] }
napi-derive = "3.7.1"
napi-build = "2.6.0"
